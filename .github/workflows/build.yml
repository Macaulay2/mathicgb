name: Build
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: >-
      ${{ matrix.build-system }} / ${{ matrix.os }} /
      ${{ matrix.debug && 'debug' || 'release' }} /
      ${{ matrix.tbb && 'tbb' || 'no tbb' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build-system:
          - autotools
          - cmake
        os:
          - macos-latest
          - ubuntu-latest
        debug:
          - false
          - true
        tbb:
          - true
          - false
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          if test ${{ matrix.os }} = ubuntu-latest
          then sudo apt-get install -y pkg-config libgtest-dev libmemtailor-dev \
                   libmathic-dev libtbb-dev
          else brew install autoconf automake libtool pkgconf googletest \
                   Macaulay2/tap/memtailor Macaulay2/tap/mathic tbb
               echo "CPPFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
               echo "LDFLAGS= -L$(brew --prefix)/lib"     >> $GITHUB_ENV
          fi
          # Build in parallel.  make reads MAKEFLAGS from the environment,
          # so this reaches the sub-makes distcheck runs as well.
          echo "MAKEFLAGS=-j$(getconf _NPROCESSORS_ONLN || echo 2)" >> $GITHUB_ENV
      - name: Install dependency metadata for macOS CMake consumers
        if: matrix.build-system == 'cmake' && runner.os == 'macOS'
        shell: bash
        run: |
          # Current Homebrew CMake bottles omit dependency package metadata.
          # Released Autotools builds supply it without depending on another PR.
          prefix="$RUNNER_TEMP/dependencies"
          export CPPFLAGS="-I$prefix/include $CPPFLAGS"
          export LDFLAGS="-L$prefix/lib $LDFLAGS"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          for dependency in memtailor:1.4 mathic:1.5; do
            name=${dependency%:*}
            version=${dependency#*:}
            curl -fsSL "https://github.com/Macaulay2/$name/archive/refs/tags/v$version.tar.gz" \
              -o "$RUNNER_TEMP/$name.tar.gz"
            tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
            (
              cd "$RUNNER_TEMP/$name-$version"
              ./autogen.sh
              ./configure --prefix="$prefix" --enable-shared
              make -j2
              make install
            )
          done
          echo "CMAKE_PREFIX_PATH=$prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Build and check
        run: |
          set -o pipefail
          mkdir build-dir
          cd build-dir
          if test ${{ matrix.build-system }} = autotools
          then ../autogen.sh
               ../configure ${{ matrix.debug && '--enable-debug' || '' }} \
                            ${{ !matrix.tbb && '--without-tbb' || '' }}
               make
               make check
          else cmake -B. -S.. -GNinja \
                 -DCMAKE_BUILD_TYPE=${{ matrix.debug && 'Debug' || 'Release' }} \
                 -Dwith_tbb=${{ matrix.tbb && 'ON' || 'OFF' }} 2>&1 | tee cmake.log
               grep -q "Multithreading with TBB: ${{ matrix.tbb && 'ON' || 'OFF' }}" \
                 cmake.log ||
                 { echo "::error::cmake did not honour with_tbb"; exit 1; }
               ninja
               src/mathicgb-unit-tests
          fi
      - name: Check the distribution tarball
        if: matrix.build-system == 'autotools' && !matrix.debug && matrix.tbb
        working-directory: build-dir
        run: make distcheck

      - name: Test installed CMake packages
        if: matrix.build-system == 'cmake'
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          BUILD_CONFIG: ${{ matrix.debug && 'Debug' || 'Release' }}
          EXPECT_DEBUG: ${{ matrix.debug && 'ON' || 'OFF' }}
          WITH_TBB: ${{ matrix.tbb && 'ON' || 'OFF' }}
          EXPECT_NO_TBB: ${{ matrix.tbb && 'OFF' || 'ON' }}
        run: |
          for shared in ON OFF; do
            build="$RUNNER_TEMP/mathicgb-$shared"
            prefix="$build/install"
            cmake -S . -B "$build" -GNinja \
              -DCMAKE_BUILD_TYPE="$BUILD_CONFIG" -DBUILD_SHARED_LIBS="$shared" \
              -DBUILD_TESTING=OFF -Dwith_tbb="$WITH_TBB" \
              -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$build" --target install
            pc=$(find "$prefix" -name mathicgb.pc -print -quit)
            flags=$(PKG_CONFIG_PATH="$(dirname "$pc")${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" pkg-config --cflags mathicgb)
            if test "$EXPECT_DEBUG" = ON; then
              [[ "$flags" == *-DMATHICGB_DEBUG* ]]
            else
              [[ "$flags" != *-DMATHICGB_DEBUG* ]]
            fi
            if test "$EXPECT_NO_TBB" = ON; then
              [[ "$flags" == *-DMATHICGB_NO_TBB* ]]
            else
              [[ "$flags" != *-DMATHICGB_NO_TBB* ]]
            fi
            mv "$prefix" "$build/relocated"
            cmake -S cmake/tests -B "$build/consumer" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=11 \
              -DCMAKE_PREFIX_PATH="$build/relocated" \
              -DEXPECT_DEBUG="$EXPECT_DEBUG" -DEXPECT_NO_TBB="$EXPECT_NO_TBB"
            cmake --build "$build/consumer"
            ctest --test-dir "$build/consumer" --output-on-failure
          done

  ubsan:
    name: undefined behaviour sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get install -y libgtest-dev libmemtailor-dev \
                                  libmathic-dev libtbb-dev
          echo "MAKEFLAGS=-j$(getconf _NPROCESSORS_ONLN || echo 2)" >> $GITHUB_ENV
      - name: Build and check
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          # automake prints only a summary on failure; VERBOSE makes it cat
          # the test log, which is where the sanitizer's diagnostics are.
          VERBOSE: 1
        run: |
          mkdir build-dir
          cd build-dir
          ../autogen.sh
          # -fno-sanitize-recover=all is what makes a report fail the job
          # rather than print and continue.
          #
          # Alignment is excluded, and only because of the packaged
          # dependencies: mathic's KDEntryArray places entries wanting 8-byte
          # alignment on 4-byte boundaries in memtailor Arena memory. That is
          # 325 reports across 113 sites, every one of them that single cause,
          # already fixed in mathic's git but not in the Ubuntu package
          # installed above. Drop -fno-sanitize=alignment once the package
          # catches up, and re-check our own sites then -- they share the
          # cause and should go with it.
          ../configure --enable-debug \
            CXXFLAGS="-fsanitize=undefined -fno-sanitize=alignment \
              -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          make
          make check

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: editorconfig-checker/action-editorconfig-checker@v2
      - name: Check whitespace against .editorconfig
        run: editorconfig-checker
